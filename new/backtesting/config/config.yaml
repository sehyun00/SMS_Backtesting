# ============================================================
# SMS Backtesting Configuration
# Fama-French 5-Factor + TGNN/DDPG/Hybrid Models
# ============================================================

project:
  name: "Hybrid_TGNN_DDPG_Research"
  seed: 42
  device: "cuda"  # 또는 "cpu"
  selected_model: "hybrid"  # Options: "tgnn", "ddpg", "hybrid", "ALL"

paths:
  data_dir: "data"
  results_dir: "results"

data:
  window_size: 12
  predict_window: 1
  stock_universes: []  # Empty = Use ALL stocks (55개)
  features: ["Open", "High", "Low", "Close", "Volume"]
  factors: true  # Enable Fama-French 5-Factor (+RF)

model:
  softmax_temperature: 3.0  # Entropy Injection for Risk Control (Prevent All-in)
  
  # Reproducibility Settings
  reproducibility:
    deterministic: true
    cudnn_benchmark: false
    seed: 42

  # Hybrid 앙상블 Alpha 설정
  hybrid_alpha_min: 0.1
  hybrid_alpha_max: 0.9
  hybrid_alpha_mode: "dynamic"  # "fixed" 또는 "dynamic" (리밸런싱 주기 인식)
  hybrid_horizon_dim: 8         # 리밸런싱 주기 임베딩 차원
  hybrid_warmup_episodes: 50    # Critic 안정화를 위한 Alpha 학습 지연 (Epochs)
  hybrid:
      tgnn_checkpoint: "auto"    # "auto" 또는 경로 직접 지정 (자동 탐색)
  
  tgnn:
    hidden_dim: 64
    num_heads: 4
    dropout: 0.1
  
  ddpg:
    actor_lr: 0.0001
    critic_lr: 0.001
    gamma: 0.99
    tau: 0.001
    batch_size: 64  # trainer.py에서 사용
    weight_decay: 0.00001 # 1e-5 (L2 규제)
    noise_std: 0.05       # 안정성을 위해 기존 0.1에서 축소

training:
  episodes: 800
  early_stopping: 50
  batch_size: 64
  buffer_size: 10000
  test_split_date: "2021-01-01"

backtest:
  initial_capital: 1000000
  transaction_cost: 0.001  # 0.1%
  risk_free_rate: 0.02     # 연간 2% (Sharpe Ratio용)
